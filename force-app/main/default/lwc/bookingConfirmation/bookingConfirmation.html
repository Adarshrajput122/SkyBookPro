<template>
    <lightning-card title="Review Order Summary" icon-name="utility:money">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Processing airline checkouts..." size="medium"></lightning-spinner>
            </template>
            
            <div class="slds-box slds-m-bottom_medium slds-theme_default">
                <p><strong>Selected Target Flight Offer Key:</strong> {offerId}</p>
                <p class="slds-text-heading_medium slds-text-color_success"><strong>Expected Price Amount: GBP {expectedPrice}</strong></p>
            </div>

            <div class="slds-text-align_right">
                <lightning-button variant="success" label="Confirm & Instant Book" icon-name="utility:lock" onclick={handleCheckoutExecute}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
