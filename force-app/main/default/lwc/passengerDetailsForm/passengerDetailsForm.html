<template>
    <lightning-card title="Passenger Information Manifest" icon-name="utility:user">
        <div class="slds-p-around_medium">
            <template for:each={passengerFormsList} for:item="form" for:index="idx">
                <div key={form.id} class="slds-box slds-m-bottom_medium slds-theme_shade">
                    <div class="slds-text-title_caps slds-m-bottom_small"><strong>Traveler #{form.displayIndex} Details</strong></div>
                    <div class="slds-grid slds-wrap slds-gutter_small">
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <lightning-input class="passenger-input" type="text" label="First Name" required></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <lightning-input class="passenger-input" type="text" label="Last Name" required></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <lightning-input class="passenger-input" type="text" label="Passport Number" required></lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
                            <lightning-input class="passenger-input" type="date" label="DOB" required></lightning-input>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
