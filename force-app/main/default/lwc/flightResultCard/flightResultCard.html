<template>
    <div class="slds-box slds-theme_default slds-box_small flight-card-wrapper">
        <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
            
            <!-- 1. Carrier Profile Field Metadata -->
            <div class="slds-col slds-size_1-of-4 slds-p-around_x-small">
                <div class="slds-text-heading_small slds-truncate" title={flightOffer.airline}>
                    <strong>{flightOffer.airline}</strong>
                </div>
                <div class="slds-text-body_small slds-text-color_weak">
                    Flight: {flightOffer.flightNumber}
                </div>
            </div>

            <!-- 2. Timeline Operational Routes Slices Details -->
            <div class="slds-col slds-size_2-of-4 slds-p-around_x-small">
                <div class="slds-grid slds-grid_align-spread slds-text-align_center">
                    <div>
                        <div class="slds-text-heading_medium"><strong>{flightOffer.origin}</strong></div>
                        <div class="slds-text-body_small">{formattedDepartureTime}</div>
                    </div>
                    
                    <div class="slds-p-horizontal_medium slds-m-top_x-small">
                        <div class="slds-text-color_weak slds-text-body_small">{flightOffer.cabinClass}</div>
                        <lightning-icon icon-name="utility:forward" size="small" class="slds-m-horizontal_x-small"></lightning-icon>
                    </div>

                    <div>
                        <div class="slds-text-heading_medium"><strong>{flightOffer.destination}</strong></div>
                        <div class="slds-text-body_small">{formattedArrivalTime}</div>
                    </div>
                </div>
            </div>

            <!-- 3. Financial Metrics & Booking Action Triggers -->
            <div class="slds-col slds-size_1-of-4 slds-p-around_x-small slds-text-align_right">
                <div class="slds-text-heading_large slds-text-color_success">
                    <strong>{flightOffer.currencyCode} {flightOffer.price}</strong>
                </div>
                <div class="slds-m-top_x-small">
                    <lightning-button 
                        variant="success" 
                        label="Select Ticket" 
                        icon-name="utility:check"
                        onclick={handleTicketSelection}>
                    </lightning-button>
                </div>
            </div>

        </div>
    </div>
</template>
